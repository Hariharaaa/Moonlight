name: FullMoon CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install root dependencies
      run: npm install

    - name: Run Midnight Compact tests
      run: npm test

    - name: Run zkPoR Solidity & Circuit tests
      run: |
        cd zkpor-contracts
        npm install
        npx hardhat test

    - name: Build Unified Frontend
      run: |
        cd frontend
        npm install
        npm run build
